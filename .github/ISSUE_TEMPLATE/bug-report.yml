name: Bug report
description: Report a reproducible problem in RightMark
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Enter...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or non-sensitive logs. Never include credentials or private data.
